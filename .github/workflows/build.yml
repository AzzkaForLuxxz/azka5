name: Build Azka5 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-azka5:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "azka5.cpp" -o "azka5.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-azka5
          path: "azka5.exe"
